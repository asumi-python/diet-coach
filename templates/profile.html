<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロフィール設定 - ダイエットコーチ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #fff0f6, #f0f4ff); min-height: 100vh; }
        .setup-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 2rem;
            max-width: 440px;
            margin: 0 auto;
        }
        .input-unit {
            position: relative;
        }
        .input-unit input {
            padding-right: 3rem;
        }
        .input-unit .unit {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #adb5bd;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<nav class="navbar" style="background: linear-gradient(90deg,#ff6b9d,#c44dff);">
    <div class="container">
        <span class="navbar-brand fw-bold text-white">🌸 ダイエットコーチ</span>
    </div>
</nav>

<div class="container py-5">
    <div class="setup-card">
        <div class="text-center mb-4">
            <div style="font-size:3.5rem;">🐰</div>
            <h2 class="fw-bold mt-2">はじめまして！</h2>
            <p class="text-muted">まず情報を入力してください</p>
        </div>

        <form method="POST" action="/profile">
            <div class="mb-3">
                <label class="form-label fw-bold">身長</label>
                <div class="input-unit">
                    <input type="number" class="form-control form-control-lg"
                           name="shincho" step="0.1" min="150" max="220"
                           value="{{ profile.shincho if profile.shincho else '' }}"
                           placeholder="158" required>
                    <span class="unit">cm</span>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">現在の体重</label>
                <div class="input-unit">
                    <input type="number" class="form-control form-control-lg"
                           name="taiju_start" step="0.1" min="50" max="200"
                           value="{{ profile.taiju_start if profile.taiju_start else '' }}"
                           placeholder="60.0" required>
                    <span class="unit">kg</span>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">目標体重</label>
                <div class="input-unit">
                    <input type="number" class="form-control form-control-lg"
                           name="taiju_mokuhyo" step="0.1" min="30" max="200"
                           value="{{ profile.taiju_mokuhyo if profile.taiju_mokuhyo else '' }}"
                           placeholder="52.0" required>
                    <span class="unit">kg</span>
                </div>
            </div>

            <button type="submit" class="btn btn-lg w-100 fw-bold text-white"
                    style="background: linear-gradient(90deg,#ff6b9d,#c44dff); border:none; border-radius:12px;">
                さあ、はじめよう！🐰
            </button>
        </form>
    </div>
</div>
</body>
</html>
