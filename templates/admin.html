<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タスク管理 - ダイエットコーチ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #fff0f6, #f0f4ff); min-height: 100vh; }
        .task-row {
            background: #fff;
            border-radius: 12px;
            padding: 0.85rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
<nav class="navbar" style="background: linear-gradient(90deg,#ff6b9d,#c44dff);">
    <div class="container">
        <span class="navbar-brand fw-bold text-white">🌸 ダイエットコーチ</span>
        <a href="/" class="btn btn-outline-light btn-sm">← 戻る</a>
    </div>
</nav>

<div class="container py-4" style="max-width: 480px;">
    <h2 class="fw-bold mb-4">タスク管理</h2>

    <!-- タスク一覧 -->
    <div class="d-flex flex-column gap-3 mb-4">
        {% for task in tasks %}
        <div class="task-row">
            <span>{{ task.icon }} {{ task.namae }}</span>
            <form method="POST" action="/admin/task/{{ task.id }}/sakujo"
                  onsubmit="return confirm('「{{ task.namae }}」を削除しますか？')">
                <button type="submit" class="btn btn-sm btn-outline-danger">削除</button>
            </form>
        </div>
        {% endfor %}
        {% if not tasks %}
        <p class="text-muted text-center">タスクがありません。追加してください。</p>
        {% endif %}
    </div>

    <!-- タスク追加 -->
    <div class="card border-0 shadow-sm p-3" style="border-radius:16px;">
        <h5 class="fw-bold mb-3">＋ タスクを追加</h5>
        <form method="POST" action="/admin/task/tsuika">
            <div class="mb-2">
                <label class="form-label small fw-bold">アイコン（絵文字）</label>
                <input type="text" class="form-control" name="icon"
                       value="✅" maxlength="2" style="width:80px;">
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold">タスク名 <span class="text-danger">*</span></label>
                <input type="text" class="form-control" name="namae"
                       placeholder="例：寝る前にストレッチ10分" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">追加する</button>
        </form>
    </div>
</div>
</body>
</html>
